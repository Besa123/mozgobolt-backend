[versions]
kotlin = "2.4.20"
logback = "1.6.3"
exposed = "1.5.0"
postgresql = "42.7.13"
hikariCP = "7.1.0"
dotenv = "6.5.1"
password4j = "1.8.4"
flyway = "13.7.0"
kotlin-logging = "8.0.4"
logstash-logback-encoder = "9.0"
janino = "3.1.12"
resend = "4.26.0"
resilience4j = "2.4.0"
ktlint-plugin = "14.2.0"
detekt = "1.23.8"
testcontainers = "2.0.5"
thumbnailator = "0.4.21"
clamav-client = "2.1.2"
aws-sdk = "2.55.1"
s3mock-testcontainers = "5.2.0"
sentry = "8.57.0"
sentry-gradle-plugin = "6.22.0"
h3 = "4.5.0"
libphonenumber = "8.13.55"
firebase-admin = "9.10.0"
lettuce = "6.5.5.RELEASE"
kotlinx-coroutines-reactive = "1.11.0"

[libraries]
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }
janino = { module = "org.codehaus.janino:janino", version.ref = "janino" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-migration-core = { module = "org.jetbrains.exposed:exposed-migration-core", version.ref = "exposed" }
exposed-migration-jdbc = { module = "org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikariCP = { module = "com.zaxxer:HikariCP", version.ref = "hikariCP" }
dotenv = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenv" }
password4j = { module = "com.password4j:password4j", version.ref = "password4j" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
resend = { module = "com.resend:resend-java", version.ref = "resend" }
resilience4j-kotlin = { module = "io.github.resilience4j:resilience4j-kotlin", version.ref = "resilience4j" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
thumbnailator = { module = "net.coobird:thumbnailator", version.ref = "thumbnailator" }
clamav-client = { module = "xyz.capybara:clamav-client", version.ref = "clamav-client" }
aws-sdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }
aws-sdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client", version.ref = "aws-sdk" }
s3mock-testcontainers = { module = "com.adobe.testing:s3mock-testcontainers", version.ref = "s3mock-testcontainers" }
sentry-logback = { module = "io.sentry:sentry-logback", version.ref = "sentry" }
h3 = { module = "com.uber:h3", version.ref = "h3" }
libphonenumber = { module = "com.googlecode.libphonenumber:libphonenumber", version.ref = "libphonenumber" }
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
kotlinx-coroutines-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive", version.ref = "kotlinx-coroutines-reactive" }

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
sentry-gradle = { id = "io.sentry.jvm.gradle", version.ref = "sentry-gradle-plugin" }
