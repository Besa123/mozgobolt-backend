ktor {
    environment = "local"
    environment = ${?ENVIRONMENT}

    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"

        shutdownGracePeriod = 2000
        shutdownTimeout = 5000
    }

    application {
        modules = [com.mozgobolt.ApplicationKt.rootModule]
    }
}

app {
    baseUrl = "http://localhost:8080"
    baseUrl = ${?APP_BASE_URL}

    database {
        url = ${DB_URL}
        user = ${DB_USER}
        password = ${DB_PASSWORD}

        # HikariCP pool settings
        poolSize = 10
        poolSize = ${?DB_POOL_SIZE}
    }

    jwt {
        secret = ${JWT_SECRET}
        issuer = ${JWT_ISSUER}
        audience = ${JWT_AUDIENCE}

        accessTokenExpiration = 15
        accessTokenExpiration = ${?JWT_ACCESS_TOKEN_EXPIRATION}
        refreshTokenExpiration = 10080
        refreshTokenExpiration = ${?JWT_REFRESH_TOKEN_EXPIRATION}
    }

    security {
        passwordPepper = ${PASSWORD_PEPPER}
    }

    cors {
        allowedHosts = ""
        allowedHosts = ${?CORS_ALLOWED_HOSTS}
    }

    email {
        resendApiKey = ""
        resendApiKey = ${?RESEND_API_KEY}
        fromAddress = "noreply@example.com"
        fromAddress = ${?EMAIL_FROM_ADDRESS}
        verificationTokenExpirationHours = 24
    }

    media {
        localStorageDirectory = "./data/pantry-entry-images"
        localStorageDirectory = ${?PANTRY_IMAGE_STORAGE_DIR}
        maxImagesPerEntry = 3
        maxImagesPerEntry = ${?PANTRY_IMAGE_MAX_PER_ENTRY}
    }

    clamAv {
        enabled = false
        enabled = ${?CLAMAV_ENABLED}
        host = "localhost"
        host = ${?CLAMAV_HOST}
        port = 3310
        port = ${?CLAMAV_PORT}
    }

    objectStorage {
        enabled = false
        enabled = ${?OBJECT_STORAGE_ENABLED}
        endpoint = ""
        endpoint = ${?OBJECT_STORAGE_ENDPOINT}
        bucket = ""
        bucket = ${?OBJECT_STORAGE_BUCKET}
        accessKeyId = ""
        accessKeyId = ${?OBJECT_STORAGE_ACCESS_KEY_ID}
        secretAccessKey = ""
        secretAccessKey = ${?OBJECT_STORAGE_SECRET_ACCESS_KEY}
        region = "auto"
        region = ${?OBJECT_STORAGE_REGION}
        apiCallTimeoutMs = 30000
        apiCallTimeoutMs = ${?OBJECT_STORAGE_API_CALL_TIMEOUT_MS}
        apiCallAttemptTimeoutMs = 10000
        apiCallAttemptTimeoutMs = ${?OBJECT_STORAGE_API_CALL_ATTEMPT_TIMEOUT_MS}
    }

    sentry {
        dsn = ""
        dsn = ${?SENTRY_DSN}
    }

    push {
        enabled = false
        enabled = ${?PUSH_ENABLED}
        serviceAccountJson = ""
        serviceAccountJson = ${?FCM_SERVICE_ACCOUNT_JSON}
    }

    redis {
        url = ""
        url = ${?REDIS_URL}
    }
}
